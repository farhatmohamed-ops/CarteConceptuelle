<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة المفعول به </title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-site: #E3F2FD;
            --main-color: #1976D2;
            --accent-color: #FF9800;
            --success-color: #4CAF50;
            --home-color: #FF6B6B; 
            --text-dark: #2C3E50;
            --node-bg: #ffffff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-site);
            background-image: radial-gradient(rgba(0,0,0,0.05) 2px, transparent 2px);
            background-size: 30px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            color: var(--text-dark);
            min-height: 100vh;
        }

        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px; 
            text-decoration: none;
            background-color: var(--home-color);
            color: white;
            padding: 10px 20px;
            border-radius: 15px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 0 #D32F2F;
            transition: all 0.2s;
            z-index: 1000;
        }

        .home-btn:hover {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #D32F2F;
        }

        .answers-pool {
            background: white;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 8px 0 #CFD8DC;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 95%;
            max-width: 1000px;
            min-height: 100px; 
            margin-top: 60px; 
            margin-bottom: 30px;
            border: 3px solid var(--main-color);
            box-sizing: border-box; 
        }

        .drag-item {
            background: var(--accent-color);
            color: white;
            padding: 8px 15px;
            border-radius: 12px;
            cursor: grab;
            font-weight: 800;
            font-size: 0.95rem;
            box-shadow: 0 4px 0 #E65100;
            user-select: none;
        }

        .map-area {
            position: relative;
            width: 100%;
            max-width: 1300px;
            height: 900px; 
            background: rgba(255, 255, 255, 0.4);
            border-radius: 40px;
            border: 4px dashed var(--main-color);
            margin-bottom: 50px;
            overflow: hidden;
        }

        .node {
            position: absolute;
            padding: 10px 15px;
            border-radius: 20px;
            font-weight: 700;
            text-align: center;
            transform: translate(50%, -50%); 
            white-space: normal;     
            min-width: 140px;
            max-width: 220px;          
            line-height: 1.6;          
            font-size: 0.85rem;
            background: var(--node-bg);
            border: 3px solid var(--main-color);
            box-shadow: 0 4px 0 #CFD8DC;
            z-index: 2;
        }

        .node-main {
            background: var(--main-color);
            color: white;
            font-size: 1.4rem;
            font-weight: 900;
            box-shadow: 0 8px 0 #0D47A1;
            border: none;
            z-index: 10;
        }

        .static-node {
            border-color: #9E9E9E !important;
            box-shadow: 0 4px 0 #E0E0E0;
        }

        .inline-drop {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 65px;
            height: 28px; 
            background: #F5F5F5;
            border: 2px dashed #BDBDBD;
            border-radius: 6px;
            vertical-align: middle;
            margin: 3px 2px;
            transition: all 0.3s;
            box-sizing: border-box;
            font-size: 0.85rem;
            font-weight: 800;
            color: transparent; 
        }

        .inline-drop.correct {
            background: var(--success-color) !important;
            border: 2px solid var(--success-color) !important;
            color: white !important;
            box-shadow: 0 3px 0 #2E7D32 !important;
            padding: 0 8px;
        }

        svg {
            position: absolute;
            top: 0; right: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        #victory {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            text-align: center;
            z-index: 10000;
            border: 5px solid var(--success-color);
        }

        @media (max-width: 1024px) {
            .map-area { height: auto; min-height: 1200px; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 20px; border: none; background: transparent; }
            .node { position: relative; transform: none; right: auto !important; top: auto !important; margin: 0; max-width: 90%; }
            svg { display: none; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="home-btn">
        <span>🏠</span>
        الرئيسية
    </a>

    <h1 id="game-title" style="margin-top: 10px;">خريطة المفعول به</h1>
    
    <div class="answers-pool" id="answers-pool"></div>

    <div class="map-area" id="map-area">
        <svg id="lines-svg"></svg>
        <div class="node node-main" style="right: 50%; top: 8%;" id="main-node">المفعول به</div>
    </div>

    <div id="victory">
        <h2>🎉 عمل رائع! 🎉</h2>
        <p>لقد نجحت في إكمال الخريطة بذكاء، أنت حقاً بطل في النحو!</p>
        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
            <button onclick="location.reload()" style="padding:10px 20px; cursor:pointer; background: var(--accent-color); color:white; border:none; border-radius:10px; font-weight:bold; font-family:'Cairo'">العب مرة أخرى</button>
            <a href="index.html" style="padding:10px 20px; text-decoration:none; background: var(--main-color); color:white; border-radius:10px; font-weight:bold; font-family:'Cairo'">الخروج</a>
        </div>
    </div>

    <script>
        const config = {
            elements: [
                // الفرع الأيمن: التعريف
                { type: "static", text: "تعريفه:<br>هو اسم يدل على من وقع عليه فعل الفاعل، وهو ركن من أركان الجملة الفعلية. كما أن المفعول به نجده إجابة على سؤال <br>\"ماذا + الفعل\"", x: "15%", y: "22%", px: "50%", py: "8%" },
                { type: "static", text: "مثال:<br>أكل الولدُ التفاحةَ.<br>الفعل: أكل<br>الفاعل: الولد<br>المفعول به: التفاحة", x: "15%", y: "45%", px: "15%", py: "22%" },

                // الفرع الأوسط: الإعراب
                { type: "multi", text: "إعرابه:<br>المفعول به يرد دائماً [منصوبا]     .", x: "50%", y: "25%", px: "50%", py: "8%" },

                // الفرع الأيسر: الأشكال النحوية
                { type: "static", text: "أشكاله النحوية:<br>يرد المفعول به في أشكال نحوية متعدّدة", x: "85%", y: "22%", px: "50%", py: "8%" },
                
                // تفرع الأشكال: مفردة
                { type: "static", text: "مفردة", x: "70%", y: "38%", px: "85%", py: "22%" },
                { type: "multi", text: "مثال:<br>سقى الأبُ [الأشجار]", x: "55%", y: "52%", px: "70%", py: "38%" },

                // تفرع الأشكال: مركب
                { type: "static", text: "مركب<br><span style='font-size:0.75rem; color:#666;'>مركب نعتي أو إضافي أو عطفي أو بالبدل أو بالجر</span>", x: "90%", y: "45%", px: "85%", py: "22%" },

                // أنواع المركبات والأمثلة (الصف السفلي)
                { type: "multi", text: "مركب بالبدل<br>(مبدل منه + بدل)<br>مثال: زرع الفلاح [ذلك] [الحقل]", x: "93%", y: "75%", px: "90%", py: "45%" },
                // Nettoyage des espaces ici pour éviter les erreurs de comparaison au drop
                { type: "multi", text: "مركب بالعطف<br>(معطوف عليه + معطوف)<br>مثال: لبس الطفل [حذاء|قبعة] و[حذاء|قبعة]", x: "75%", y: "75%", px: "90%", py: "45%" },
                { type: "multi", text: "مركب نعتي<br>(منعوت + نعت)<br>مثال: يعين الشيخ [الجار] [الفقير]", x: "55%", y: "75%", px: "90%", py: "45%" },
                { type: "multi", text: "مركب إضافي<br>(مضاف + مضاف إليه)<br>مثال: استمع التلاميذ [نصيحة] [المعلم]", x: "35%", y: "75%", px: "90%", py: "45%" },
                { type: "multi", text: "مركب بالجر<br>(جار + مجرور)<br>مثال: دافع الحارس [عن] [المرمى]", x: "15%", y: "75%", px: "90%", py: "45%" }
            ]
        };

        const pool = document.getElementById('answers-pool');
        const map = document.getElementById('map-area');
        const svg = document.getElementById('lines-svg');
        let totalBlanks = 0; 
        let solved = 0;
        let allAnswers = []; 

        function initGame() {
            config.elements.forEach((el) => {
                const zone = document.createElement('div');
                zone.className = 'node';
                zone.style.right = el.x; 
                zone.style.top = el.y;

                if (el.type === 'static') {
                    zone.classList.add('static-node');
                    zone.innerHTML = el.text;
                } 
                else if (el.type === 'multi') {
                    let formattedText = el.text.replace(/\[([^\]]+)\]/g, (match, word) => {
                        totalBlanks++;
                        let cleanedWord = word.trim();
                        
                        if (cleanedWord.includes('|')) {
                            let options = cleanedWord.split('|');
                            options.forEach(opt => {
                                if(!allAnswers.includes(opt.trim())) {
                                    allAnswers.push(opt.trim());
                                }
                            });
                        } else {
                            if(!allAnswers.includes(cleanedWord)) {
                                allAnswers.push(cleanedWord);
                            }
                        }
                        return `<span class="inline-drop" data-answer="${cleanedWord}"></span>`;
                    });
                    
                    zone.innerHTML = formattedText;

                    setTimeout(() => {
                        const dropZones = zone.querySelectorAll('.inline-drop');
                        dropZones.forEach(drop => {
                            drop.addEventListener('dragover', (e) => e.preventDefault());
                            drop.addEventListener('drop', handleDrop);
                        });
                    }, 0);
                }

                map.appendChild(zone);
                if(el.px && el.py) {
                    drawLine(el.px, el.py, el.x, el.y);
                }
            });

            // خلط الإجابات عشوائياً ووضعها في شريط السحب
            const shuffledAnswers = [...allAnswers].sort(() => Math.random() - 0.5);
            shuffledAnswers.forEach((answer, index) => {
                const dragEl = document.createElement('div');
                dragEl.className = 'drag-item';
                dragEl.innerText = answer;
                dragEl.draggable = true;
                dragEl.id = `drag-${index}`;
                dragEl.addEventListener('dragstart', (e) => e.dataTransfer.setData('text', answer + '|' + dragEl.id));
                pool.appendChild(dragEl);
            });
        }

        function drawLine(startX, startY, endX, endY) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            const x1 = 100 - parseFloat(startX) + "%"; 
            const x2 = 100 - parseFloat(endX) + "%"; 
            
            line.setAttribute("x1", x1); line.setAttribute("y1", startY);
            line.setAttribute("x2", x2); line.setAttribute("y2", endY);
            line.setAttribute("stroke", "#BDBDBD"); 
            line.setAttribute("stroke-width", "3");
            svg.appendChild(line);
        }

        function handleDrop(e) {
            e.preventDefault();
            
            const dropZone = e.target.closest('.inline-drop');
            if (!dropZone) return; 

            const rawData = e.dataTransfer.getData('text');
            if (!rawData) return;

            const data = rawData.split('|');
            const val = data[0] ? data[0].trim() : ""; 
            const id = data[1];

            const targetAnswer = dropZone.dataset.answer ? dropZone.dataset.answer.trim() : "";

            // Correction ici : la logique de validation prend maintenant correctement en compte le séparateur '|'
            const isCorrect = val === targetAnswer || (targetAnswer.includes('|') && targetAnswer.split('|').map(x => x.trim()).includes(val));

            if (isCorrect && !dropZone.classList.contains('correct')) {
                dropZone.innerText = val; 
                dropZone.classList.add('correct'); 
                
                // Optionnel : Cache le mot du pool uniquement si nécessaire ou laisse tel quel pour réutilisation
                const draggedElement = document.getElementById(id);
                if (draggedElement) draggedElement.style.display = 'none'; 
                
                solved++;
        
                if (solved === totalBlanks) {
                    document.getElementById('victory').style.display = 'block';
                }
            } else if (!dropZone.classList.contains('correct')) {
                dropZone.style.backgroundColor = '#FFEBEE';
                dropZone.style.borderColor = 'red';
                setTimeout(() => {
                    dropZone.style.backgroundColor = '#F5F5F5';
                    dropZone.style.borderColor = '#BDBDBD';
                }, 500);
            }
        }

        initGame();
    </script>
</body>
</html>
